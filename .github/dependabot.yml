# Configure Dependabot version updates. Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
        update-types:
          - major
      jest:
        patterns:
          - "jest"
          - "jest-*"
          - "babel-jest"
          - "@types/jest"
        update-types:
          - major
      babel:
        patterns:
          - "@babel/*"
        update-types:
          - major
      stylelint:
        patterns:
          - "stylelint"
          - "stylelint-*"
        update-types:
          - major
      webpack:
        patterns:
          - "webpack"
          - "webpack-cli"
        update-types:
          - major
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
